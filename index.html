<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيكرت سانتا 🎄 Secret Santa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root{--primary-red:#c0392b;--dark-red:#962d22;--christmas-green:#27ae60;--dark-green:#1e824c;--accent-gold:#f1c40f;--snow-white:#fefefe;--bg-dark:#0f172a}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;user-select:none}
        body{background:linear-gradient(135deg,#0d1b2a 0%,#1b263b 50%,#0d1b2a 100%);min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-x:hidden;position:relative;padding:20px 10px 40px}
        .crazy-banner{width:100%;max-width:600px;background:linear-gradient(90deg,#ff0055,#ff0000,#ffb700,#00ff66,#00d4ff,#ff0055);background-size:400% 400%;animation:crazyGradient 3s ease infinite,crazyShake 1.2s ease-in-out infinite alternate;border-radius:20px;padding:14px 18px;margin-bottom:12px;text-align:center;box-shadow:0 0 25px rgba(255,0,85,.8),0 0 10px rgba(255,255,255,.5);border:2px solid #fff;z-index:20}
        .crazy-text{font-size:1.25rem;font-weight:900;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 12px rgba(255,255,255,.9);letter-spacing:.5px;display:inline-block;animation:crazyPop .8s ease-in-out infinite alternate}
        .ebra-note{font-size:.95rem;font-weight:800;color:#f1c40f;margin-top:6px;text-shadow:1px 1px 4px rgba(0,0,0,.8);display:block}
        @keyframes crazyGradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
        @keyframes crazyShake{0%{transform:rotate(-2deg) scale(.98)}50%{transform:rotate(2deg) scale(1.02)}100%{transform:rotate(-1deg) scale(1)}}
        @keyframes crazyPop{0%{transform:scale(.95)}100%{transform:scale(1.05)}}
        #snow-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
        .container{width:100%;max-width:600px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:30px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 30px rgba(192,57,43,.2);z-index:10;position:relative;text-align:center}
        .header-decor{font-size:3.5rem;margin-bottom:5px;animation:bounce 2s infinite ease-in-out;text-shadow:0 0 15px rgba(241,196,15,.6)}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        h1{font-size:2.2rem;font-weight:900;color:var(--accent-gold);margin-bottom:8px;text-shadow:2px 2px 8px rgba(0,0,0,.6)}
        .subtitle{font-size:.95rem;color:#cbd5e1;margin-bottom:25px;line-height:1.5}
        .admin-nav{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:600px;margin-bottom:12px;z-index:10}
        .admin-badge{background:rgba(241,196,15,.2);border:1px solid var(--accent-gold);color:var(--accent-gold);padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:6px}
        .btn-admin-login{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#e2e8f0;padding:6px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;transition:all .3s ease}
        .btn-admin-login:hover{background:var(--accent-gold);color:#000;border-color:var(--accent-gold)}
        .panel{display:none;animation:fadeIn .4s ease-out forwards}
        .panel.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .form-group{margin-bottom:22px;text-align:right}
        label{display:block;margin-bottom:8px;font-weight:700;font-size:1rem;color:#f8fafc}
        
        select {
            width: 100%;
            padding: 14px 16px;
            background: #1e293b !important;
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            color: #ffffff !important;
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: #1e293b !important;
            color: #ffffff !important;
            padding: 12px;
            font-size: 1.05rem;
        }
        
        input{width:100%;padding:14px 16px;background:rgba(15,23,42,.7);border:2px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;font-size:1.05rem;outline:none}
        
        .btn-festive{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary-red) 0%,var(--dark-red) 100%);color:#fff;border:none;border-radius:16px;font-size:1.2rem;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(192,57,43,.4);transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:10px}
        .btn-festive:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(192,57,43,.6)}
        .gift-box-container{margin:30px 0}
        .gift-icon{font-size:6rem;display:inline-block;animation:pulseGift 1.5s infinite alternate}
        @keyframes pulseGift{0%{transform:scale(1)}100%{transform:scale(1.08) rotate(3deg)}}
        .result-card{background:linear-gradient(135deg,rgba(39,174,96,.2) 0%,rgba(30,130,76,.3) 100%);border:2px solid var(--christmas-green);border-radius:20px;padding:25px 20px;margin:20px 0}
        .result-label{font-size:.95rem;color:#a7f3d0;margin-bottom:8px}
        .assigned-name{font-size:2.2rem;font-weight:900;color:var(--accent-gold);margin:10px 0}
        .admin-table-wrapper{overflow-x:auto;margin-top:15px;border-radius:12px;border:1px solid rgba(255,255,255,.1)}
        table{width:100%;border-collapse:collapse;text-align:right;font-size:.9rem}
        th,td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
        th{background:rgba(241,196,15,.15);color:var(--accent-gold);font-weight:700}
        tr:nth-child(even){background:rgba(255,255,255,.03)}
        .status-badge{padding:4px 8px;border-radius:8px;font-size:.75rem;font-weight:700;display:inline-block}
        .status-done{background:rgba(39,174,96,.2);color:#2ecc71;border:1px solid #2ecc71}
        .status-pending{background:rgba(241,196,15,.2);color:#f1c40f;border:1px solid #f1c40f}
        .btn-danger{background:#e74c3c;color:#fff;border:none;padding:10px 18px;border-radius:12px;font-weight:700;cursor:pointer;margin-top:15px}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
        .modal-card{background:#1e293b;border:1px solid rgba(255,255,255,.2);border-radius:20px;width:100%;max-width:400px;padding:25px;text-align:center}
        .remaining-box{font-size:.85rem;color:#94a3b8;margin-top:15px;background:rgba(0,0,0,.2);padding:8px 14px;border-radius:10px;display:inline-block}
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    <div class="crazy-banner">
        <span class="crazy-text">🔥 فرح اخواتك الـ 5% في رأس السنة 🎉🎁</span>
        <span class="ebra-note">💬 متنساش تقول رأيك في التصميم لـ ENG. Ebra 🎨✨</span>
    </div>
    <div class="admin-nav">
        <div class="admin-badge" id="adminBadge" style="display: none;">🛡️ لوحة التحكم (الأدمن)</div>
        <div></div>
        <button class="btn-admin-login" id="adminToggleBtn" onclick="openAdminModal()">🔒 دخول الأدمن</button>
    </div>
    <div class="container">
        <div class="header-decor">🎄</div>
        <h1>سيكرت سانتا 🎅</h1>
        <p class="subtitle">اختر اسمك واكتشف الشخص الذي ستقدم له هديتك هذا الكريسماس!</p>
        
        <div id="panel-select" class="panel active">
            <div class="form-group">
                <label for="userSelect">👤 اختر اسمك من القائمة:</label>
                <select id="userSelect">
                    <option value="" disabled selected>-- اختر اسمك هنا --</option>
                </select>
            </div>
            <button class="btn-festive" onclick="handleStart
